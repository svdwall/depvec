repos:
  - repo: local
    hooks:
      - id: clang-tidy-extractor
        name: clang-tidy extractor
        entry: scripts/clang-tidy-hook build/extractor
        language: system
        types: [c++]
        files: ^src/extractor/.*\.cpp$
      - id: clang-tidy-backend
        name: clang-tidy backend
        entry: scripts/clang-tidy-hook build/backend-nix
        language: system
        types: [c++]
        files: ^(src|test)/backend/.*\.cpp$
      - id: clang-tidy-examples
        name: clang-tidy examples
        entry: >-
          sh -c 'exec clang-tidy --quiet
          --checks=-bugprone-easily-swappable-parameters
          --extra-arg-before=-xc --extra-arg-before=-std=c11
          --extra-arg-before=-Iexamples/programs "$@" --' --
        language: system
        types: [c]
        files: ^examples/.*\.c$
